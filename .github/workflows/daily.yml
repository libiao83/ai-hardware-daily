name: Daily AI Hardware Tracker
on:
  schedule:
    - cron: '0 9 * * *'  # 每天 UTC 09:00 (北京时间 17:00)
  workflow_dispatch:      # 允许手动触发

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch daily hotspots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_daily.py

      - name: Commit and push
        run: |
          git config user.name "ai-hardware-daily[bot]"
          git config user.email "ai-hardware-daily[bot]@users.noreply.github.com"
          git add daily/ README.md
          git diff --staged --quiet || (
            git commit -m "📊 Daily update: $(date +%Y-%m-%d)"
            git push
          )
